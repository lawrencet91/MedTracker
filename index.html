<html lang="zh-CN">

<title>每日药盒 Daily Pillbox</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one narrow column like a phone app; huge tap targets; tab bar fixed at the bottom. */
:root {
  --bg: #F2F5F1;
  --surface: #FFFFFF;
  --ink: #18211E;
  --muted: #56625D;
  --line: #D5DDD8;
  --accent: #0D6A55;
  --accent-ink: #FFFFFF;
  --done-bg: #E1F0EA;
  --due: #A84F0C;
  --due-bg: #FBE9DA;
  --danger: #B3261E;
  --font-sc: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-tc: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --tabs-h: 68px;
  padding-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #1A2220; --ink: #ECF2EF; --muted: #A2B0AA; --line: #2C3733;
    --accent: #43B898; --accent-ink: #05221B; --done-bg: #17302A; --due: #F2A468; --due-bg: #3A2616;
    --danger: #FF8A80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #1A2220; --ink: #ECF2EF; --muted: #A2B0AA; --line: #2C3733;
  --accent: #43B898; --accent-ink: #05221B; --done-bg: #17302A; --due: #F2A468; --due-bg: #3A2616;
  --danger: #FF8A80; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--font-sc); font-size: 20px; line-height: 1.45; }
body.zht { font-family: var(--font-tc); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px calc(var(--tabs-h) + 56px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }

.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.date { font-size: 28px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.langs { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.langs button { border: 0; background: none; padding: 6px 12px; font-size: 16px; min-height: 40px; }
.langs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

.progress { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.progress strong { font-size: 24px; }
.bar { display: flex; gap: 4px; }
.bar span { flex: 1; height: 14px; border-radius: 7px; background: var(--line); }
.bar span.on { background: var(--accent); }
.progress.complete { background: var(--done-bg); border-color: var(--accent); }

.note { font-size: 16px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

.card { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.card.due { border-color: var(--due); }
.card.done { background: var(--done-bg); border-color: transparent; }
.entry { display: flex; align-items: center; gap: 12px; }
.entry .txt { flex: 1; min-width: 0; }
.entry h2, .group h2 { margin: 0; font-size: 24px; line-height: 1.25; overflow-wrap: anywhere; }
.when { font-size: 16px; color: var(--muted); overflow-wrap: anywhere; }
.badge { display: inline-block; font-size: 15px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--due-bg); color: var(--due); margin-top: 4px; }
.pill { width: 30px; height: 15px; border-radius: 8px; border: 1px solid rgba(0,0,0,.3); flex: none; display: inline-block; }
.entry > .pill { width: 36px; height: 18px; border-radius: 9px; }
.tick { flex: none; min-height: 64px; min-width: 104px; border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); font-size: 22px; font-weight: 700; padding: 6px 14px; }
.tick:active, .big:active { transform: scale(.97); }
.taken { flex: none; text-align: right; font-size: 19px; color: var(--accent); font-weight: 700; display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; }
.link { background: none; border: 0; color: var(--accent); font-size: 17px; text-decoration: underline; padding: 4px 0; min-height: 40px; font-weight: 400; }

.group { display: flex; flex-direction: column; gap: 6px; }
.group-items { display: flex; flex-direction: column; }
.group-items .entry { padding-block: 10px; border-top: 1px solid var(--line); }
.group-items h2 { font-size: 21px; }
.group-items .tick { min-height: 56px; min-width: 92px; font-size: 20px; }
.big { width: 100%; min-height: 64px; border: 2px solid var(--accent); border-radius: 14px; background: var(--surface); color: var(--accent); font-size: 22px; font-weight: 700; padding: 8px 16px; margin-top: 6px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
.tabs div { display: flex; width: 100%; max-width: 560px; }
.tabs button { flex: 1; border: 0; background: none; min-height: var(--tabs-h); font-size: 20px; color: var(--muted); border-top: 4px solid transparent; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; border-top-color: var(--accent); }

.day { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.day-head { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; }
.row { display: flex; justify-content: space-between; gap: 12px; font-size: 18px; }
.row span:first-child { min-width: 0; overflow-wrap: anywhere; }
.row .t { font-variant-numeric: tabular-nums; color: var(--accent); white-space: nowrap; }
.row .miss { color: var(--muted); white-space: nowrap; }
.row.grp { font-weight: 700; margin-top: 4px; color: var(--muted); font-size: 16px; }

h1.sec { margin: 0; font-size: 26px; }
h2.sub { margin: 10px 0 0; font-size: 21px; }
.hint { font-size: 16px; color: var(--muted); margin: 0; }
.setup-list { display: flex; flex-direction: column; gap: 8px; }
.setup-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.setup-row .txt { flex: 1; min-width: 0; }
.setup-row strong { overflow-wrap: anywhere; }
.btn { min-height: 52px; padding: 8px 18px; border-radius: 12px; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); font-weight: 700; }
.btn.solid { background: var(--accent); color: var(--accent-ink); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.small { min-height: 44px; padding: 4px 14px; font-size: 17px; }

.form { display: flex; flex-direction: column; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.form-title { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 700; overflow-wrap: anywhere; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lbl { font-weight: 700; font-size: 18px; }
.field input[type=text], .field input[type=time], .field select, .search { min-height: 52px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); width: 100%; }
.days { display: flex; flex-wrap: wrap; gap: 6px; }
.days button { min-width: 48px; min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.days button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatches button { width: 48px; height: 36px; border-radius: 18px; border: 1px solid rgba(0,0,0,.3); padding: 0; }
.swatches button[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 2px; }
.checks { display: flex; flex-direction: column; }
.checks label { display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid var(--line); font-size: 20px; }
.checks input { width: 26px; height: 26px; accent-color: var(--accent); flex: none; }
.checks .other { font-size: 15px; color: var(--muted); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 52px; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; gap: 8px; font-size: 19px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.chip:disabled { opacity: .55; cursor: default; }
.custom-row { display: flex; gap: 8px; }
.custom-row input { flex: 1; min-width: 0; }
.pick-bar { position: fixed; left: 0; right: 0; bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px; display: flex; justify-content: center; z-index: 6; }
.pick-bar .actions { width: 100%; max-width: 528px; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.sheet { background: var(--surface); border-radius: 20px; padding: 22px; max-width: 440px; width: 100%; display: flex; flex-direction: column; gap: 18px; font-size: 22px; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabs-h) + 16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 22px; border-radius: 999px; font-weight: 700; z-index: 8; max-width: calc(100% - 32px); text-align: center; }
p { margin: 0; }
@media (prefers-reduced-motion: reduce) { .tick:active, .big:active { transform: none; } }
</style>
</head>

];

let canSave = true, S = null;
try { const raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw); } catch (e) { canSave = false; }
if (S && !S.items) {
  // Upgrade from the first version, where every entry was a group.
  if (S.sample) S = { lang: S.lang, items: sampleItems(), groups: [], log: {}, sample: true };
  else {
    const items = [], groups = [];
    for (const g of S.groups || []) {
      const base = { key: null, note: '', when: g.when, time: g.time, days: g.days };
      if (g.items.length === 1) items.push({ ...base, id: g.items[0].id, name: g.items[0].name, color: g.items[0].color, group: null });
      else {
        groups.push({ id: g.id, name: g.name, when: g.when, time: g.time, days: g.days });
        g.items.forEach(it => items.push({ ...base, id: it.id, name: it.name, color: it.color, group: g.id }));
      }
    }
    S = { lang: S.lang, items, groups, log: S.log || {}, sample: false };
  }
}
if (!S) {
  const nl = (navigator.language || '').toLowerCase();
  const lang = /^zh-(tw|hk|mo|hant)/.test(nl) ? 'zht' : nl.startsWith('en') ? 'en' : 'zhs';
  S = { lang, items: sampleItems(), groups: [], log: {}, sample: true };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { canSave = false; } }

let tab = 'today', view = 'list', draft = null, picked = new Set(), pickedCustom = [], query = '', modalCb = null, toastTimer = null;
const t = (k, v = {}) => String(T[S.lang][k]).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtTime = ts => new Date(ts).toLocaleTimeString(LOC[S.lang], { hour: 'numeric', minute: '2-digit' });
const fmtHM = hm => { const [h, m] = hm.split(':').map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return fmtTime(d); };
const mins = hm => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
const takenAt = (k, id) => (S.log[k] || {})[id];
const itemName = i => i.key && CAT[i.key] ? CAT[i.key].n[S.lang] : (i.name || '?');
const groupOf = i => i.group ? S.groups.find(g => g.id === i.group) : null;
const timingOf = i => groupOf(i) || i;
const onDay = (x, d) => !x.days.length || x.days.includes(d.getDay());
const whenLabel = x => x.when === 'time' ? t('at', { t: fmtHM(x.time) }) : t(x.when);
const daysLabel = x => x.days.length ? [...x.days].sort((a, b) => a - b).map(d => T[S.lang].wd[d]).join(' ') : t('every');
const sortKey = x => x.when === 'time' ? mins(x.time) : ORDER[x.when];
const pillDot = c => `<span class="pill" style="background:${esc(c)}"></span>`;
const membersOf = g => S.items.filter(i => i.group === g.id);

// What is due on a given day: groups (with their pills) and single pills.
function entriesOn(d) {
  const out = [];
  for (const g of S.groups) { const items = membersOf(g); if (items.length && onDay(g, d)) out.push({ g, items, timing: g }); }
  for (const i of S.items) if (!groupOf(i) && onDay(i, d)) out.push({ g: null, items: [i], timing: i });
  return out;
}

function render() {
  document.documentElement.lang = LOC[S.lang];
  document.body.className = S.lang;
  const now = new Date();
  const date = now.toLocaleDateString(LOC[S.lang], { month: 'long', day: 'numeric', weekday: 'long' });
  let html = `<div class="top"><div class="date">${esc(date)}</div><div class="langs" role="group">
    ${[['zhs','简'],['zht','繁'],['en','EN']].map(([k,l]) => `<button data-a="lang" data-v="${k}" aria-pressed="${S.lang===k}">${l}</button>`).join('')}</div></div>`;
  if (!canSave) html += `<p class="note">${t('noSave')}</p>`;
  if (tab === 'today') html += renderToday(now);
  else if (tab === 'history') html += renderHistory(now);
  else html += view === 'pick' ? renderPicker() : view === 'item' ? renderItemForm() : view === 'group' ? renderGroupForm() : renderSetup();
  document.getElementById('app').innerHTML = html;
  document.getElementById('tabs').innerHTML = ['today','history','setup'].map(k =>
    `<button data-a="tab" data-v="${k}" ${tab===k?'aria-current="page"':''}>${t(k)}</button>`).join('');
  const bar = document.getElementById('pickbar');
  bar.hidden = !(tab === 'setup' && view === 'pick');
  if (!bar.hidden) renderPickBar();
}

function itemRow(i, k, nowMin, timing, showWhen) {
  const ts = takenAt(k, i.id);
  const due = !ts && timing.when === 'time' && nowMin >= mins(timing.time);
  const sub = [showWhen ? whenLabel(timing) : '', i.note].filter(Boolean).join(' · ');
  return `<div class="entry">${pillDot(i.color)}<div class="txt"><h2>${esc(itemName(i))}</h2>
    ${sub ? `<div class="when">${esc(sub)}</div>` : ''}${due && showWhen ? `<span class="badge">${t('due')}</span>` : ''}</div>
    ${ts ? `<div class="taken">✓ ${esc(fmtTime(ts))}<button class="link" data-a="undo" data-v="${i.id}">${t('undo')}</button></div>`
         : `<button class="tick" data-a="take" data-v="${i.id}">${t('took')}</button>`}</div>`;
}

function renderToday(now) {
  const k = dayKey(now), nowMin = now.getHours() * 60 + now.getMinutes();
  const es = entriesOn(now).map(e => ({ ...e, done: e.items.filter(i => takenAt(k, i.id)).length }))
    .map(e => ({ ...e, full: e.done === e.items.length }))
    .sort((a, b) => (a.full - b.full) || (sortKey(a.timing) - sortKey(b.timing)));
  if (!es.length) return `<div class="progress complete"><strong>${t('nothing')}</strong></div>`;
  const all = es.flatMap(e => e.items), got = all.filter(i => takenAt(k, i.id)).length;
  let h = `<div class="progress ${got===all.length?'complete':''}"><strong>${got===all.length ? t('allDone') : t('progress',{a:got,b:all.length})}</strong>
    <div class="bar">${all.map(i => takenAt(k, i.id)).sort((a, b) => !!b - !!a).map(x => `<span class="${x?'on':''}"></span>`).join('')}</div></div>`;
  if (S.sample) h += `<p class="note">${t('sample')}</p>`;
  for (const e of es) {
    if (!e.g) {
      const due = !e.full && e.timing.when === 'time' && nowMin >= mins(e.timing.time);
      h += `<section class="card ${e.full?'done':''} ${due?'due':''}">${itemRow(e.items[0], k, nowMin, e.timing, true)}</section>`;
      continue;
    }
    const left = e.items.length - e.done;
    const due = !e.full && e.timing.when === 'time' && nowMin >= mins(e.timing.time);
    h += `<section class="card group ${e.full?'done':''} ${due?'due':''}"><div><h2>${esc(e.g.name)}</h2>
      <div class="when">${esc(whenLabel(e.g))} · ${e.done}/${e.items.length}</div>${due ? `<span class="badge">${t('due')}</span>` : ''}</div>
      <div class="group-items">${e.items.map(i => itemRow(i, k, nowMin, e.g, false)).join('')}</div>
      ${left >= 2 ? `<button class="big" data-a="takeGroup" data-v="${e.g.id}">${t('tookAll',{n:left})}</button>` : ''}</section>`;
  }
  return h;
}

function renderHistory(now) {
  let h = `<h1 class="sec">${t('last7')}</h1>`;
  for (let n = 0; n < 7; n++) {
    const d = new Date(now); d.setDate(d.getDate() - n);
    const k = dayKey(d), es = entriesOn(d).sort((a, b) => sortKey(a.timing) - sortKey(b.timing));
    const all = es.flatMap(e => e.items), got = all.filter(i => takenAt(k, i.id)).length;
    const label = n === 0 ? t('today') : d.toLocaleDateString(LOC[S.lang], { month: 'short', day: 'numeric', weekday: 'short' });
    h += `<div class="day"><div class="day-head"><span>${esc(label)}</span><span>${got}/${all.length}${all.length && got===all.length?' ✅':''}</span></div>`;
    for (const e of es) {
      if (e.g) h += `<div class="row grp"><span>${esc(e.g.name)}</span></div>`;
      for (const i of e.items) {
        const ts = takenAt(k, i.id);
        h += `<div class="row"><span>${esc(itemName(i))}</span>${ts ? `<span class="t">${esc(fmtTime(ts))}</span>` : `<span class="miss">${t('notTaken')}</span>`}</div>`;
      }
    }
    h += `</div>`;
  }
  return h;
}

function renderSetup() {
  const items = [...S.items].sort((a, b) => sortKey(timingOf(a)) - sortKey(timingOf(b)));
  let h = `<h1 class="sec">${t('setup')}</h1><p class="hint">${t('setupIntro')}</p>`;
  if (S.sample) h += `<div class="note">${t('sampleSetup')}<button class="btn small" data-a="clearSample">${t('clearSample')}</button></div>`;
  h += `<h2 class="sub">${t('myMeds')}</h2><div class="setup-list">`;
  if (!items.length) h += `<p class="hint">${t('emptyMine')}</p>`;
  for (const i of items) {
    const g = groupOf(i);
    const sub = g ? t('inGroup', { n: g.name }) : `${whenLabel(i)} · ${daysLabel(i)}`;
    h += `<div class="setup-row">${pillDot(i.color)}<div class="txt"><strong>${esc(itemName(i))}</strong>
      <div class="when">${esc(sub)}${i.note ? ' · ' + esc(i.note) : ''}</div></div>
      <button class="btn small" data-a="editItem" data-v="${i.id}">${t('edit')}</button></div>`;
  }
  h += `</div><button class="btn solid" data-a="pick">${t('addMeds')}</button>`;
  h += `<h2 class="sub">${t('groupsTitle')}</h2><p class="hint">${t('groupsHint')}</p><div class="setup-list">`;
  if (!S.groups.length) h += `<p class="hint">${t('noGroups')}</p>`;
  for (const g of S.groups) {
    h += `<div class="setup-row"><div class="txt"><strong>${esc(g.name)}</strong>
      <div class="when">${esc(whenLabel(g))} · ${esc(daysLabel(g))}</div>
      <div class="when">${membersOf(g).map(i => esc(itemName(i))).join('、') || '—'}</div></div>
      <button class="btn small" data-a="editGroup" data-v="${g.id}">${t('edit')}</button></div>`;
  }
  return h + `</div><button class="btn" data-a="newGroup">${t('addGroup')}</button>`;
}

function renderPicker() {
  return `<h1 class="sec">${t('pickTitle')}</h1>
    <input type="search" class="search" id="q" placeholder="${t('search')}" value="${esc(query)}" aria-label="${t('search')}">
    <div id="chips">${chipsHTML()}</div>
    <div class="field"><label for="custom">${t('customLbl')}</label>
      <div class="custom-row"><input type="text" id="custom" class="search"><button class="btn" data-a="addCustom">${t('customAdd')}</button></div></div>`;
}
function chipsHTML() {
  const q = query.trim().toLowerCase();
  const have = new Set(S.items.filter(i => !i.sample).map(i => i.key));
  let h = '';
  for (const type of ['supp', 'med']) {
    const list = CATALOG[type].filter(([key]) => !q || Object.values(CAT[key].n).some(n => n.toLowerCase().includes(q)));
    if (!list.length) continue;
    h += `<h2 class="sub">${t(type)}</h2><div class="chips">${list.map(([key, color]) => have.has(key)
      ? `<button class="chip" disabled>${pillDot(color)}${esc(CAT[key].n[S.lang])} ✓ ${t('have')}</button>`
      : `<button class="chip" data-a="toggleChip" data-v="${key}" aria-pressed="${picked.has(key)}">${pillDot(color)}${esc(CAT[key].n[S.lang])}</button>`).join('')}</div>`;
  }
  if (pickedCustom.length) h += `<div class="chips" style="margin-top:12px">${pickedCustom.map((n, ix) =>
    `<button class="chip" data-a="rmCustom" data-v="${ix}" aria-pressed="true">${pillDot(C.white)}${esc(n)} ×</button>`).join('')}</div>`;
  return h;
}
function renderPickBar() {
  const n = picked.size + pickedCustom.length;
  document.getElementById('pickbar').innerHTML = `<div class="actions"><button class="btn" data-a="back">${t('cancel')}</button>
    <button class="btn solid" data-a="confirmPick" ${n ? '' : 'disabled'}>${t('addN', { n })}</button></div>`;
}

function timingFields(d) {
  return `<div class="field"><label for="f-when">${t('fWhen')}</label><select id="f-when" data-f="when">
      ${WHEN.map(w => `<option value="${w}" ${d.when===w?'selected':''}>${w==='time' ? t('fTime') : t(w)}</option>`).join('')}</select></div>
    ${d.when === 'time' ? `<div class="field"><label for="f-time">${t('fTime')}</label><input type="time" id="f-time" data-f="time" value="${esc(d.time)}"></div>` : ''}
    <div class="field"><span class="lbl">${t('fDays')}</span><div class="days">
      <button data-a="dayAll" aria-pressed="${!d.days.length}">${t('every')}</button>
      ${T[S.lang].wd.map((w, i) => `<button data-a="day" data-v="${i}" aria-pressed="${d.days.includes(i)}">${w}</button>`).join('')}</div></div>`;
}

function renderItemForm() {
  const d = draft, g = d.group ? S.groups.find(x => x.id === d.group) : null;
  return `<div class="form">
    ${d.key ? `<div class="form-title">${pillDot(d.color)}${esc(CAT[d.key].n[S.lang])}</div>`
            : `<div class="field"><label for="f-name">${t('fName')}</label><input type="text" id="f-name" data-f="name" value="${esc(d.name)}"></div>`}
    <div class="field"><label for="f-note">${t('fNote')}</label><input type="text" id="f-note" data-f="note" value="${esc(d.note)}" placeholder="${t('notePh')}"></div>
    ${S.groups.length ? `<div class="field"><label for="f-group">${t('fGroup')}</label><select id="f-group" data-f="group">
      <option value="">${t('noGroup')}</option>${S.groups.map(x => `<option value="${x.id}" ${d.group===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>` : ''}
    ${g ? `<p class="hint">${esc(t('groupTiming', { n: g.name }))}</p>` : timingFields(d)}
    <div class="field"><span class="lbl">${t('fColor')}</span><div class="swatches">${COLORS.map(c =>
      `<button data-a="color" data-c="${c}" style="background:${c}" aria-pressed="${d.color===c}" aria-label="${c}"></button>`).join('')}</div></div>
    <div class="actions"><button class="btn" data-a="back">${t('cancel')}</button><button class="btn solid" data-a="saveItem">${t('save')}</button></div>
    <button class="btn danger" data-a="delItem">${t('del')}</button></div>`;
}

function renderGroupForm() {
  const d = draft;
  return `<div class="form">
    <div class="field"><label for="f-name">${t('fName')}</label><input type="text" id="f-name" data-f="name" value="${esc(d.name)}" placeholder="${t('groupPh')}"></div>
    ${timingFields(d)}
    <div class="field"><span class="lbl">${t('fMembers')}</span><div class="checks">${S.items.map(i => {
      const other = i.group && i.group !== d.id ? groupOf(i) : null;
      return `<label>${''}<input type="checkbox" data-m="${i.id}" ${d.members.includes(i.id)?'checked':''}>${pillDot(i.color)}<span>${esc(itemName(i))}
        ${other ? `<span class="other">（${esc(other.name)}）</span>` : ''}</span></label>`; }).join('')}</div></div>
    <div class="actions"><button class="btn" data-a="back">${t('cancel')}</button><button class="btn solid" data-a="saveGroup">${t('save')}</button></div>
    ${S.groups.some(g => g.id === d.id) ? `<button class="btn danger" data-a="delGroup">${t('del')}</button>` : ''}</div>`;
}

function ask(text, yes, cb) {
  document.getElementById('modal-text').textContent = text;
  document.getElementById('modal-no').textContent = t('no');
  document.getElementById('modal-yes').textContent = yes;
  modalCb = cb; document.getElementById('modal').hidden = false;
  document.getElementById('modal-no').focus();
}
function closeModal() { document.getElementById('modal').hidden = true; modalCb = null; }
document.getElementById('modal-no').onclick = closeModal;
document.getElementById('modal-yes').onclick = () => { const cb = modalCb; closeModal(); cb && cb(); };
document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

function toast(msg) {
  const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 2500);
}
function log(ids) {
  const k = dayKey(new Date()), ts = Date.now();
  S.log[k] = S.log[k] || {};
  ids.forEach(id => { if (!S.log[k][id]) S.log[k][id] = ts; });
  save(); render(); toast(t('recorded', { t: fmtTime(ts) }));
}
function dropSamples() {
  if (!S.sample) return;
  S.items = S.items.filter(i => !i.sample); S.sample = false;
}
function goSetup() { view = 'list'; draft = null; render(); window.scrollTo(0, 0); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, v = b.dataset.v, k = dayKey(new Date());
  if (a === 'tab') { tab = v; view = 'list'; draft = null; render(); window.scrollTo(0, 0); }
  else if (a === 'lang') { S.lang = v; save(); render(); }
  else if (a === 'take') log([v]);
  else if (a === 'takeGroup') log(S.items.filter(i => i.group === v && !takenAt(k, i.id)).map(i => i.id));
  else if (a === 'undo') { const i = S.items.find(x => x.id === v); ask(t('undoQ', { n: itemName(i) }), t('yes'), () => { delete (S.log[k] || {})[v]; save(); render(); }); }
  else if (a === 'back') goSetup();
  else if (a === 'clearSample') { dropSamples(); save(); render(); }
  else if (a === 'pick') { view = 'pick'; picked = new Set(); pickedCustom = []; query = ''; render(); window.scrollTo(0, 0); }
  else if (a === 'toggleChip') { picked.has(v) ? picked.delete(v) : picked.add(v); b.setAttribute('aria-pressed', picked.has(v)); renderPickBar(); }
  else if (a === 'addCustom') {
    const el = document.getElementById('custom'), n = el.value.trim();
    if (!n) { toast(t('needName')); return; }
    pickedCustom.push(n); el.value = ''; document.getElementById('chips').innerHTML = chipsHTML(); renderPickBar();
  }
  else if (a === 'rmCustom') { pickedCustom.splice(+v, 1); document.getElementById('chips').innerHTML = chipsHTML(); renderPickBar(); }
  else if (a === 'confirmPick') {
    dropSamples();
    picked.forEach(key => S.items.push(newItem(key)));
    pickedCustom.forEach(n => S.items.push(newItem(null, n)));
    save(); toast(t('addN', { n: picked.size + pickedCustom.length }) + ' ✓'); goSetup();
  }
  else if (a === 'editItem') { draft = JSON.parse(JSON.stringify(S.items.find(i => i.id === v))); view = 'item'; render(); window.scrollTo(0, 0); }
  else if (a === 'newGroup') { draft = { id: uid(), name: '', when: 'breakfast', time: '08:00', days: [], members: [] }; view = 'group'; render(); window.scrollTo(0, 0); }
  else if (a === 'editGroup') { const g = S.groups.find(x => x.id === v); draft = { ...JSON.parse(JSON.stringify(g)), members: membersOf(g).map(i => i.id) }; view = 'group'; render(); window.scrollTo(0, 0); }
  else if (a === 'dayAll') { draft.days = []; render(); }
  else if (a === 'day') { const n = +v; draft.days = draft.days.includes(n) ? draft.days.filter(x => x !== n) : [...draft.days, n]; if (draft.days.length === 7) draft.days = []; render(); }
  else if (a === 'color') { draft.color = b.dataset.c; render(); }
  else if (a === 'saveItem') {
    if (!draft.key && !draft.name.trim()) { toast(t('needName')); return; }
    delete draft.sample;
    S.items = S.items.map(i => i.id === draft.id ? draft : i);
    if (!S.items.some(i => i.sample)) S.sample = false;
    save(); goSetup();
  }
  else if (a === 'delItem') ask(t('delQ', { n: itemName(draft) }), t('delYes'), () => {
    S.items = S.items.filter(i => i.id !== draft.id); if (!S.items.some(i => i.sample)) S.sample = false; save(); goSetup(); });
  else if (a === 'saveGroup') {
    if (!draft.name.trim()) { toast(t('needName')); return; }
    const { members, ...g } = draft;
    const ix = S.groups.findIndex(x => x.id === g.id);
    if (ix >= 0) S.groups[ix] = g; else S.groups.push(g);
    S.items.forEach(i => { if (members.includes(i.id)) i.group = g.id; else if (i.group === g.id) i.group = null; });
    save(); goSetup();
  }
  else if (a === 'delGroup') ask(t('delQ', { n: draft.name }), t('delYes'), () => {
    S.groups = S.groups.filter(g => g.id !== draft.id);
    S.items.forEach(i => { if (i.group === draft.id) i.group = null; });
    save(); goSetup(); });
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { query = el.value; document.getElementById('chips').innerHTML = chipsHTML(); return; }
  if (!draft) return;
  if (['name', 'note', 'time'].includes(el.dataset.f)) draft[el.dataset.f] = el.value;
});
document.addEventListener('change', e => {
  const el = e.target; if (!draft) return;
  if (el.dataset.f === 'when') { draft.when = el.value; render(); }
  else if (el.dataset.f === 'group') { draft.group = el.value || null; render(); }
  else if (el.dataset.m) { const id = el.dataset.m; draft.members = el.checked ? [...draft.members, id] : draft.members.filter(x => x !== id); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.getElementById('modal').hidden) closeModal();
  if (e.key === 'Enter' && e.target.id === 'custom') document.querySelector('[data-a="addCustom"]').click();
});

let lastDay = dayKey(new Date());
setInterval(() => { if (tab === 'setup' && view !== 'list') return; const d = dayKey(new Date()); if (d !== lastDay) lastDay = d; render(); }, 60000);
render();
</script>
</body>
</html>
