<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日药盒">
<meta name="theme-color" content="#0D6A55">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>每日药盒 Daily Pillbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a phone app; huge tap targets; tab bar fixed at the bottom. */
:root {
  --bg: #F2F5F1;
  --surface: #FFFFFF;
  --ink: #18211E;
  --muted: #56625D;
  --line: #D5DDD8;
  --accent: #0D6A55;
  --accent-ink: #FFFFFF;
  --done-bg: #E1F0EA;
  --due: #A84F0C;
  --due-bg: #FBE9DA;
  --danger: #B3261E;
  --font-sc: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-tc: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #1A2220; --ink: #ECF2EF; --muted: #A2B0AA; --line: #2C3733;
    --accent: #43B898; --accent-ink: #05221B; --done-bg: #17302A; --due: #F2A468; --due-bg: #3A2616;
    --danger: #FF8A80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #1A2220; --ink: #ECF2EF; --muted: #A2B0AA; --line: #2C3733;
  --accent: #43B898; --accent-ink: #05221B; --done-bg: #17302A; --due: #F2A468; --due-bg: #3A2616;
  --danger: #FF8A80; color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-sc); font-size: 20px; line-height: 1.45; }
body.zht { font-family: var(--font-tc); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 120px; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.date { font-size: 28px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.langs { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.langs button { border: 0; background: none; padding: 6px 12px; font-size: 16px; min-height: 40px; }
.langs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

.progress { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.progress strong { font-size: 24px; }
.bar { display: flex; gap: 6px; }
.bar span { flex: 1; height: 14px; border-radius: 7px; background: var(--line); }
.bar span.on { background: var(--accent); }
.progress.complete { background: var(--done-bg); border-color: var(--accent); }

.note { font-size: 16px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; }

.card { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card.due { border-color: var(--due); }
.card.done { background: var(--done-bg); border-color: transparent; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.card-head > div { min-width: 0; }
.card h2 { margin: 0; font-size: 26px; line-height: 1.25; }
.when { font-size: 17px; color: var(--muted); }
.badge { flex: none; font-size: 16px; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: var(--due-bg); color: var(--due); }
.badge.ok { background: var(--accent); color: var(--accent-ink); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { width: 34px; height: 16px; border-radius: 8px; border: 1px solid rgba(0,0,0,.25); flex: none; display: inline-block; }
.big { width: 100%; min-height: 72px; border: 0; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font-size: 26px; font-weight: 700; padding: 10px 16px; }
.big:active { transform: scale(.98); }
.link { background: none; border: 0; color: var(--accent); font-size: 18px; text-decoration: underline; padding: 6px 0; text-align: left; min-height: 44px; }
.done-line { font-size: 22px; font-weight: 700; color: var(--accent); }

.items { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: 12px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.item .name { flex: 1; min-width: 0; font-size: 22px; }
.item .take { min-height: 52px; min-width: 96px; border-radius: 12px; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); font-weight: 700; font-size: 20px; }
.item .taken { text-align: right; font-size: 18px; color: var(--accent); font-weight: 700; display: flex; flex-direction: column; align-items: flex-end; }
.item .taken .link { font-size: 16px; font-weight: 400; padding: 0; min-height: 32px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
.tabs div { display: flex; width: 100%; max-width: 560px; }
.tabs button { flex: 1; border: 0; background: none; min-height: 68px; font-size: 20px; color: var(--muted); border-top: 4px solid transparent; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; border-top-color: var(--accent); }

.day { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.day-head { display: flex; justify-content: space-between; gap: 12px; font-weight: 700; }
.row { display: flex; justify-content: space-between; gap: 12px; font-size: 18px; }
.row span:first-child { min-width: 0; }
.row .t { font-variant-numeric: tabular-nums; color: var(--accent); white-space: nowrap; }
.row .miss { color: var(--muted); white-space: nowrap; }
.row.grp { font-weight: 700; margin-top: 4px; }

.setup-list { display: flex; flex-direction: column; gap: 10px; }
.setup-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
.setup-row > div { min-width: 0; }
.btn { min-height: 52px; padding: 8px 18px; border-radius: 12px; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); font-weight: 700; }
.btn.solid { background: var(--accent); color: var(--accent-ink); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.form { display: flex; flex-direction: column; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lbl { font-weight: 700; font-size: 18px; }
.field input[type=text], .field input[type=time], .field select { min-height: 52px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); width: 100%; }
.days { display: flex; flex-wrap: wrap; gap: 6px; }
.days button { min-width: 48px; min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
.days button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.pill-edit { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
.pill-edit .r { display: flex; gap: 8px; align-items: center; }
.pill-edit input { flex: 1; min-width: 0; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatches button { width: 44px; height: 36px; border-radius: 18px; border: 1px solid rgba(0,0,0,.3); padding: 0; }
.swatches button[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 2px; }
.x { min-width: 48px; min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--danger); font-size: 22px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.sheet { background: var(--surface); border-radius: 20px; padding: 22px; max-width: 440px; width: 100%; display: flex; flex-direction: column; gap: 18px; font-size: 22px; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 22px; border-radius: 999px; font-weight: 700; z-index: 8; max-width: calc(100% - 32px); text-align: center; }
h1.sec { margin: 0; font-size: 26px; }
p { margin: 0; }
@media (prefers-reduced-motion: reduce) { .big:active { transform: none; } }
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<nav class="tabs"><div id="tabs"></div></nav>
<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"><p id="modal-text"></p><div class="actions"><button class="btn" id="modal-no"></button><button class="btn solid" id="modal-yes"></button></div></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const T = {
  zhs: { name:'每日药盒', today:'今天', history:'记录', setup:'设置', progress:'已完成 {a} / {b}', allDone:'今天全部吃完了 ✅',
    tookAll:'全部吃了（{n}种）', took:'吃了', takenAt:'✅ {t} 已吃', partial:'已吃 {a}/{b}', choose:'只吃了一部分？点这里选择', hide:'收起',
    undo:'撤销', due:'该吃了', any:'随时', breakfast:'早餐时', lunch:'午餐时', dinner:'晚餐时', bed:'睡前', at:'{t}',
    undoQ:'撤销「{n}」的记录吗？', no:'取消', yes:'撤销', recorded:'已记录 {t}', notTaken:'未吃', nothing:'今天没有要吃的药',
    sample:'这些是示例。请家人在「设置」里改成实际的药。', setupIntro:'由家人设置。爸妈只需要用「今天」页面。', add:'＋ 新增',
    edit:'修改', fName:'名称（例如：早餐维生素）', fWhen:'什么时候吃', fTime:'时间', fDays:'哪几天吃', every:'每天', fPills:'这一组的药',
    pillName:'药名', addPill:'＋ 加一种药', save:'保存', cancel:'取消', del:'删除', delQ:'删除「{n}」？', delYes:'删除',
    wd:['日','一','二','三','四','五','六'], newName:'新的一组', needName:'请填写名称和至少一种药', last7:'最近 7 天', noSave:'这个浏览器无法保存记录。' },
  zht: { name:'每日藥盒', today:'今天', history:'記錄', setup:'設定', progress:'已完成 {a} / {b}', allDone:'今天全部吃完了 ✅',
    tookAll:'全部吃了（{n}種）', took:'吃了', takenAt:'✅ {t} 已吃', partial:'已吃 {a}/{b}', choose:'只吃了一部分？點這裡選擇', hide:'收起',
    undo:'撤銷', due:'該吃了', any:'隨時', breakfast:'早餐時', lunch:'午餐時', dinner:'晚餐時', bed:'睡前', at:'{t}',
    undoQ:'撤銷「{n}」的記錄嗎？', no:'取消', yes:'撤銷', recorded:'已記錄 {t}', notTaken:'未吃', nothing:'今天沒有要吃的藥',
    sample:'這些是示例。請家人在「設定」裡改成實際的藥。', setupIntro:'由家人設定。爸媽只需要用「今天」頁面。', add:'＋ 新增',
    edit:'修改', fName:'名稱（例如：早餐維生素）', fWhen:'什麼時候吃', fTime:'時間', fDays:'哪幾天吃', every:'每天', fPills:'這一組的藥',
    pillName:'藥名', addPill:'＋ 加一種藥', save:'儲存', cancel:'取消', del:'刪除', delQ:'刪除「{n}」？', delYes:'刪除',
    wd:['日','一','二','三','四','五','六'], newName:'新的一組', needName:'請填寫名稱和至少一種藥', last7:'最近 7 天', noSave:'這個瀏覽器無法儲存記錄。' },
  en: { name:'Daily Pillbox', today:'Today', history:'History', setup:'Setup', progress:'{a} of {b} done', allDone:'All done for today ✅',
    tookAll:'Took all {n}', took:'Took it', takenAt:'✅ Taken {t}', partial:'{a} of {b} taken', choose:'Took only some? Tap to choose', hide:'Close',
    undo:'Undo', due:'Due now', any:'Anytime', breakfast:'With breakfast', lunch:'With lunch', dinner:'With dinner', bed:'Before bed', at:'At {t}',
    undoQ:'Remove the record for "{n}"?', no:'Cancel', yes:'Remove', recorded:'Recorded at {t}', notTaken:'Not taken', nothing:'Nothing to take today',
    sample:'These are examples. Family can change them to the real pills in Setup.', setupIntro:'Set up by family. Parents only need the Today tab.', add:'+ Add',
    edit:'Edit', fName:'Name (e.g. Breakfast vitamins)', fWhen:'When to take', fTime:'Time', fDays:'Which days', every:'Every day', fPills:'Pills in this group',
    pillName:'Pill name', addPill:'+ Add a pill', save:'Save', cancel:'Cancel', del:'Delete', delQ:'Delete "{n}"?', delYes:'Delete',
    wd:['Su','Mo','Tu','We','Th','Fr','Sa'], newName:'New group', needName:'Add a name and at least one pill', last7:'Last 7 days', noSave:'This browser cannot save records.' }
};
const LOC = { zhs:'zh-CN', zht:'zh-TW', en:'en-US' };
const COLORS = ['#FFFFFF','#F7D84A','#F29A3A','#D9483B','#F2A7C3','#5B8DEF','#6CC17A','#8A5A3B'];
const WHEN = ['any','breakfast','lunch','dinner','bed','time'];
const ORDER = { breakfast:480, lunch:720, dinner:1080, bed:1320, any:1400 };
const KEY = 'pillbox.v1';

const uid = () => Math.random().toString(36).slice(2, 10);
function sample(lang) {
  const n = {
    zhs: ['早餐维生素','维生素D','钙片','鱼油','维生素C','降血压药','睡前','益生菌','镁片'],
    zht: ['早餐維生素','維生素D','鈣片','魚油','維生素C','降血壓藥','睡前','益生菌','鎂片'],
    en:  ['Breakfast vitamins','Vitamin D','Calcium','Fish oil','Vitamin C','Blood pressure','Bedtime','Probiotic','Magnesium']
  }[lang];
  return [
    { id: uid(), name: n[5], when: 'time', time: '08:00', days: [], items: [{ id: uid(), name: n[5], color: COLORS[0] }] },
    { id: uid(), name: n[0], when: 'breakfast', time: '08:00', days: [], items: [
      { id: uid(), name: n[1], color: COLORS[1] }, { id: uid(), name: n[2], color: COLORS[0] },
      { id: uid(), name: n[3], color: COLORS[2] }, { id: uid(), name: n[4], color: COLORS[3] } ] },
    { id: uid(), name: n[6], when: 'bed', time: '21:00', days: [], items: [
      { id: uid(), name: n[7], color: COLORS[4] }, { id: uid(), name: n[8], color: COLORS[5] } ] }
  ];
}

let canSave = true, S = null;
try { const raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw); } catch (e) { canSave = false; }
if (!S) {
  const nl = (navigator.language || '').toLowerCase();
  const lang = /^zh-(tw|hk|mo|hant)/.test(nl) ? 'zht' : nl.startsWith('en') ? 'en' : 'zhs';
  S = { lang, groups: sample(lang), log: {}, sample: true };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { canSave = false; } }

let tab = 'today', open = new Set(), draft = null, modalCb = null, toastTimer = null;
const t = (k, v = {}) => String(T[S.lang][k]).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtTime = ts => new Date(ts).toLocaleTimeString(LOC[S.lang], { hour: 'numeric', minute: '2-digit' });
const fmtHM = hm => { const [h, m] = hm.split(':').map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return fmtTime(d); };
const mins = hm => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; };
const groupsOn = d => S.groups.filter(g => !g.days.length || g.days.includes(d.getDay()));
const takenAt = (k, id) => (S.log[k] || {})[id];
const whenLabel = g => g.when === 'time' ? t('at', { t: fmtHM(g.time) }) : t(g.when);
const sortKey = g => g.when === 'time' ? mins(g.time) : ORDER[g.when];
const pillDot = c => `<span class="pill" style="background:${esc(c)}"></span>`;

function render() {
  document.documentElement.lang = LOC[S.lang];
  document.body.className = S.lang;
  const app = document.getElementById('app');
  const now = new Date();
  const date = now.toLocaleDateString(LOC[S.lang], { month: 'long', day: 'numeric', weekday: 'long' });
  let html = `<div class="top"><div class="date">${esc(date)}</div><div class="langs" role="group">
    ${[['zhs','简'],['zht','繁'],['en','EN']].map(([k,l]) => `<button data-a="lang" data-v="${k}" aria-pressed="${S.lang===k}">${l}</button>`).join('')}</div></div>`;
  if (!canSave) html += `<p class="note">${t('noSave')}</p>`;
  if (tab === 'today') html += renderToday(now);
  else if (tab === 'history') html += renderHistory(now);
  else html += draft ? renderForm() : renderSetup();
  app.innerHTML = html;
  document.getElementById('tabs').innerHTML = ['today','history','setup'].map(k =>
    `<button data-a="tab" data-v="${k}" ${tab===k?'aria-current="page"':''}>${t(k)}</button>`).join('');
}

function renderToday(now) {
  const k = dayKey(now), nowMin = now.getHours() * 60 + now.getMinutes();
  const gs = groupsOn(now).map(g => {
    const done = g.items.filter(i => takenAt(k, i.id)).length;
    return { g, done, full: done === g.items.length };
  }).sort((a, b) => (a.full - b.full) || (sortKey(a.g) - sortKey(b.g)));
  if (!gs.length) return `<div class="progress complete"><strong>${t('nothing')}</strong></div>`;
  const fullCount = gs.filter(x => x.full).length;
  let h = `<div class="progress ${fullCount===gs.length?'complete':''}"><strong>${fullCount===gs.length ? t('allDone') : t('progress',{a:fullCount,b:gs.length})}</strong>
    <div class="bar">${gs.map(x => `<span class="${x.full?'on':''}"></span>`).join('')}</div></div>`;
  if (S.sample) h += `<p class="note">${t('sample')}</p>`;
  for (const { g, done, full } of gs) {
    const single = g.items.length === 1;
    const isDue = !full && g.when === 'time' && nowMin >= mins(g.time);
    const last = Math.max(0, ...g.items.map(i => takenAt(k, i.id) || 0));
    const expanded = open.has(g.id) && !single;
    let badge = '';
    if (isDue) badge = `<span class="badge">${t('due')}</span>`;
    else if (!full && done) badge = `<span class="badge">${t('partial',{a:done,b:g.items.length})}</span>`;
    h += `<section class="card ${full?'done':''} ${isDue?'due':''}"><div class="card-head"><div>
      <h2>${esc(g.name)}</h2><div class="when">${esc(whenLabel(g))}${single?'':' · '+g.items.length}</div></div>${badge}</div>
      <div class="pills">${g.items.map(i => pillDot(i.color)).join('')}</div>`;
    if (full) {
      h += `<div class="done-line">${t('takenAt',{t:fmtTime(last)})}</div>`;
      h += single ? `<button class="link" data-a="undo" data-v="${g.items[0].id}">${t('undo')}</button>`
                  : `<button class="link" data-a="toggle" data-v="${g.id}">${expanded ? t('hide') : t('edit')}</button>`;
    } else {
      const left = g.items.length - done;
      h += `<button class="big" data-a="takeAll" data-v="${g.id}">${single ? t('took') : t('tookAll',{n:left})}</button>`;
      if (!single) h += `<button class="link" data-a="toggle" data-v="${g.id}">${expanded ? t('hide') : t('choose')}</button>`;
    }
    if (expanded) {
      h += `<div class="items">${g.items.map(i => {
        const ts = takenAt(k, i.id);
        return `<div class="item">${pillDot(i.color)}<span class="name">${esc(i.name)}</span>${ts
          ? `<span class="taken">✓ ${esc(fmtTime(ts))}<button class="link" data-a="undo" data-v="${i.id}">${t('undo')}</button></span>`
          : `<button class="take" data-a="takeOne" data-v="${i.id}">${t('took')}</button>`}</div>`;
      }).join('')}</div>`;
    }
    h += `</section>`;
  }
  return h;
}

function renderHistory(now) {
  let h = `<h1 class="sec">${t('last7')}</h1>`;
  for (let n = 0; n < 7; n++) {
    const d = new Date(now); d.setDate(d.getDate() - n);
    const k = dayKey(d), gs = groupsOn(d);
    const all = gs.flatMap(g => g.items), got = all.filter(i => takenAt(k, i.id)).length;
    const label = n === 0 ? t('today') : d.toLocaleDateString(LOC[S.lang], { month: 'short', day: 'numeric', weekday: 'short' });
    h += `<div class="day"><div class="day-head"><span>${esc(label)}</span><span>${got}/${all.length}${all.length && got===all.length?' ✅':''}</span></div>`;
    for (const g of gs) {
      if (g.items.length > 1) h += `<div class="row grp"><span>${esc(g.name)}</span></div>`;
      for (const i of g.items) {
        const ts = takenAt(k, i.id);
        h += `<div class="row"><span>${esc(i.name)}</span>${ts ? `<span class="t">${esc(fmtTime(ts))}</span>` : `<span class="miss">${t('notTaken')}</span>`}</div>`;
      }
    }
    h += `</div>`;
  }
  return h;
}

function renderSetup() {
  return `<h1 class="sec">${t('setup')}</h1><p class="note">${t('setupIntro')}</p><div class="setup-list">
    ${[...S.groups].sort((a,b) => sortKey(a) - sortKey(b)).map(g => `<div class="setup-row"><div><strong>${esc(g.name)}</strong>
      <div class="when">${esc(whenLabel(g))} · ${g.days.length ? [...g.days].sort((a, b) => a - b).map(d => T[S.lang].wd[d]).join(' ') : t('every')}</div>
      <div class="pills">${g.items.map(i => pillDot(i.color)).join('')}</div></div>
      <button class="btn" data-a="edit" data-v="${g.id}">${t('edit')}</button></div>`).join('')}
  </div><button class="btn solid" data-a="add">${t('add')}</button>`;
}

function renderForm() {
  const d = draft;
  return `<div class="form">
    <div class="field"><label for="f-name">${t('fName')}</label><input type="text" id="f-name" data-f="name" value="${esc(d.name)}"></div>
    <div class="field"><label for="f-when">${t('fWhen')}</label><select id="f-when" data-f="when">
      ${WHEN.map(w => `<option value="${w}" ${d.when===w?'selected':''}>${w==='time' ? t('fTime') : t(w)}</option>`).join('')}</select></div>
    ${d.when === 'time' ? `<div class="field"><label for="f-time">${t('fTime')}</label><input type="time" id="f-time" data-f="time" value="${esc(d.time)}"></div>` : ''}
    <div class="field"><span class="lbl">${t('fDays')}</span><div class="days">
      <button data-a="dayAll" aria-pressed="${!d.days.length}">${t('every')}</button>
      ${T[S.lang].wd.map((w, i) => `<button data-a="day" data-v="${i}" aria-pressed="${d.days.includes(i)}">${w}</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">${t('fPills')}</span>
      ${d.items.map((i, n) => `<div class="pill-edit"><div class="r"><input type="text" id="p-${i.id}" data-p="${n}" placeholder="${t('pillName')}" value="${esc(i.name)}" aria-label="${t('pillName')}">
        <button class="x" data-a="rmPill" data-v="${n}" aria-label="${t('del')}">×</button></div>
        <div class="swatches">${COLORS.map(c => `<button data-a="color" data-v="${n}" data-c="${c}" style="background:${c}" aria-pressed="${i.color===c}" aria-label="${c}"></button>`).join('')}</div></div>`).join('')}
      <button class="btn" data-a="addPill">${t('addPill')}</button></div>
    <div class="actions"><button class="btn" data-a="cancel">${t('cancel')}</button><button class="btn solid" data-a="save">${t('save')}</button></div>
    ${S.groups.some(g => g.id === d.id) ? `<button class="btn danger" data-a="del">${t('del')}</button>` : ''}
  </div>`;
}

function ask(text, yes, cb) {
  document.getElementById('modal-text').textContent = text;
  document.getElementById('modal-no').textContent = t('no');
  document.getElementById('modal-yes').textContent = yes;
  modalCb = cb; document.getElementById('modal').hidden = false;
  document.getElementById('modal-no').focus();
}
function closeModal() { document.getElementById('modal').hidden = true; modalCb = null; }
document.getElementById('modal-no').onclick = closeModal;
document.getElementById('modal-yes').onclick = () => { const cb = modalCb; closeModal(); cb && cb(); };
document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

function toast(msg) {
  const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 2500);
}
function log(ids) {
  const k = dayKey(new Date()), ts = Date.now();
  S.log[k] = S.log[k] || {};
  ids.forEach(id => { if (!S.log[k][id]) S.log[k][id] = ts; });
  save(); render(); toast(t('recorded', { t: fmtTime(ts) }));
}
const findItem = id => { for (const g of S.groups) for (const i of g.items) if (i.id === id) return i; };

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, v = b.dataset.v, k = dayKey(new Date());
  if (a === 'tab') { tab = v; draft = null; render(); window.scrollTo(0, 0); }
  else if (a === 'lang') { S.lang = v; save(); render(); }
  else if (a === 'takeAll') { const g = S.groups.find(x => x.id === v); log(g.items.filter(i => !takenAt(k, i.id)).map(i => i.id)); }
  else if (a === 'takeOne') log([v]);
  else if (a === 'toggle') { open.has(v) ? open.delete(v) : open.add(v); render(); }
  else if (a === 'undo') ask(t('undoQ', { n: findItem(v).name }), t('yes'), () => { delete (S.log[k] || {})[v]; save(); render(); });
  else if (a === 'edit') { draft = JSON.parse(JSON.stringify(S.groups.find(g => g.id === v))); render(); }
  else if (a === 'add') { draft = { id: uid(), name: '', when: 'any', time: '08:00', days: [], items: [{ id: uid(), name: '', color: COLORS[0] }] }; render(); }
  else if (a === 'cancel') { draft = null; render(); }
  else if (a === 'dayAll') { draft.days = []; render(); }
  else if (a === 'day') { const n = +v; draft.days = draft.days.includes(n) ? draft.days.filter(x => x !== n) : [...draft.days, n]; if (draft.days.length === 7) draft.days = []; render(); }
  else if (a === 'color') { draft.items[+v].color = b.dataset.c; render(); }
  else if (a === 'addPill') { draft.items.push({ id: uid(), name: '', color: COLORS[0] }); render(); document.getElementById('p-' + draft.items.at(-1).id).focus(); }
  else if (a === 'rmPill') { draft.items.splice(+v, 1); render(); }
  else if (a === 'save') {
    draft.items = draft.items.filter(i => i.name.trim());
    if (!draft.items.length && !draft.name.trim()) { toast(t('needName')); return; }
    if (!draft.items.length) { toast(t('needName')); draft.items.push({ id: uid(), name: '', color: COLORS[0] }); render(); return; }
    if (!draft.name.trim()) draft.name = draft.items.length === 1 ? draft.items[0].name : t('newName');
    const ix = S.groups.findIndex(g => g.id === draft.id);
    if (ix >= 0) S.groups[ix] = draft; else S.groups.push(draft);
    S.sample = false; draft = null; save(); render();
  }
  else if (a === 'del') ask(t('delQ', { n: draft.name }), t('delYes'), () => { S.groups = S.groups.filter(g => g.id !== draft.id); S.sample = false; draft = null; save(); render(); });
});
document.addEventListener('input', e => {
  if (!draft) return;
  const el = e.target;
  if (el.dataset.f === 'name' || el.dataset.f === 'time') draft[el.dataset.f] = el.value;
  else if (el.dataset.p !== undefined) draft.items[+el.dataset.p].name = el.value;
});
document.addEventListener('change', e => { if (draft && e.target.dataset.f === 'when') { draft.when = e.target.value; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('modal').hidden) closeModal(); });

let lastDay = dayKey(new Date());
setInterval(() => { if (draft) return; const d = dayKey(new Date()); if (d !== lastDay) { lastDay = d; open.clear(); } render(); }, 60000);
render();
</script>
</body>
</html>
